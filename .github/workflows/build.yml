name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x64

          - target: x86_64-apple-darwin
            os: macos-13
            platform: macos-x64

          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-aarch64

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            platform: linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\nova-agent.exe dist\nova-agent-${{ matrix.platform }}.exe

      - name: Prepare artifact (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/nova-agent dist/nova-agent-${{ matrix.platform }}
          chmod +x dist/nova-agent-${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: nova-agent-${{ matrix.platform }}
          path: dist/nova-agent-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/nova-agent-windows-x64/*
            artifacts/nova-agent-macos-x64/*
            artifacts/nova-agent-macos-aarch64/*
            artifacts/nova-agent-linux-x64/*
