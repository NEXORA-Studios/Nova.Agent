name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows x64
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

          # macOS x64 (Intel)
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin

          # macOS aarch64 (Apple Silicon)
          - name: macOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin

          # Linux x64
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

          # Linux aarch64
          - name: Linux aarch64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install aarch64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\nova-agent.exe dist\nova-agent-${{ matrix.target }}.exe

      - name: Prepare artifact (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/nova-agent dist/nova-agent-${{ matrix.target }}
          chmod +x dist/nova-agent-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: nova-agent-${{ matrix.target }}
          path: dist/nova-agent-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/nova-agent-x86_64-pc-windows-msvc/*
            artifacts/nova-agent-x86_64-apple-darwin/*
            artifacts/nova-agent-aarch64-apple-darwin/*
            artifacts/nova-agent-x86_64-unknown-linux-gnu/*
            artifacts/nova-agent-aarch64-unknown-linux-gnu/*
