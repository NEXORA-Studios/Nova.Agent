[package]
name = "nova-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
interprocess = { version = "2", features = ["tokio"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
